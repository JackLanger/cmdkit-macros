[package]
name = "cmdkit-macros"
version = "0.2.2"
edition = "2024"
description = "Procedural macros for cmdkit command strategy generation."
license = "GPL-3.0-or-later"
repository = "https://github.com/JackLanger/CMDKit-macros"
documentation = "https://docs.rs/cmdkit-macros"
readme = "README.md"
rust-version = "1.85"
keywords = ["cli", "macro", "proc-macro"]
categories = [
    "development-tools::procedural-macro-helpers",
    "command-line-interface",
]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE*"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
cmdkit = "0.2.0"
trybuild = "1"
